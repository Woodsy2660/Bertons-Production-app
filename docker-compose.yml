# Full stack for production (BV-AZ-DockerHost01) and local container runs.
#
# Production VM (after git pull):
#   sudo docker compose up -d --build
#
# Local app-on-host (dev):
#   docker compose up -d db
#   python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --reload

services:
  db:
    image: postgres:16-alpine
    container_name: berton-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-berton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-berton_dev}
      POSTGRES_DB: ${POSTGRES_DB:-berton_bottling}
    ports:
      # Host can reach Postgres on 5433 for local tools; leave as-is on VM if needed
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-berton} -d ${POSTGRES_DB:-berton_bottling}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-berton-bottling-app}:${APP_TAG:-latest}
    container_name: berton-web
    depends_on:
      db:
        condition: service_healthy
    # Port 8000 for HTTP (tablets / transition); Caddy also serves 80/443
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Internal compose network hostname is "db", not localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-berton}:${POSTGRES_PASSWORD:-berton_dev}@db:5432/${POSTGRES_DB:-berton_bottling}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      STORAGE_BACKEND: local
      # Bind mounts below land at /app/... inside the container
      UPLOAD_DIR: /app/uploads
      COMPILED_OUTPUT_DIR: /app/compiled_output
      MANAGER_USERNAME: ${MANAGER_USERNAME:-manager}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-manager}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator}
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-false}
      PALLET_TAG_DISPATCH: ${PALLET_TAG_DISPATCH:-browser}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      TZ: ${TZ:-Australia/Sydney}
    volumes:
      # Persist uploads and generated files on the VM host tree
      - ./uploads:/app/uploads
      - ./compiled_output:/app/compiled_output
      - ./pallet_tags:/app/pallet_tags
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: berton-caddy
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
