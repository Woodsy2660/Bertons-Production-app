<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/berton.css?v=6">
</head>
<body class="pdf-standalone-page">
    <div
        class="reference-pdf-viewer reference-pdf-viewer--loading"
        data-reference-pdf-viewer
        data-pdf-url="/uploads/{{ doc.id }}/view"
        data-initial-zoom="1"

        <p class="reference-pdf-status">Loading document…</p>
        <div class="reference-pdf-pages"></div>
    </div>
    <script type="module" src="/static/js/reference-pdf-viewer.js"></script>
</body>
</html>
